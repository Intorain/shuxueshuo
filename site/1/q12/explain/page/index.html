<body class="explanation-page" data-mode="page">
  <header class="topbar"><div class="topbar-inner">
    <a class="brand" href="/1/"><span class="brand-mark" aria-hidden="true">数</span>数学说</a>
    <span class="demo-label">我来讲解 · 纯页面 · Demo</span>
    <button id="restart" class="reset-button" type="button">重新开始</button>
  </div></header>
  <main class="workspace">
    <a class="chapter-return" href="/1/q12/">← 返回 Q12 练习</a>
    <nav class="explain-modes" aria-label="交互方式">
      <span aria-current="page">纯页面</span>
      <span class="explain-mode-soon">纯对话（准备中）</span>
      <a href="/1/q12/explain/">页面 + 对话</a>
    </nav>
    <section class="problem-card explain-problem" aria-label="原题">
      <p data-math-text>已知正数 $m,n$ 满足 $2m+n=6$，求 $\frac1{2m+1}+\frac1{n+1}$ 的最小值。</p>
    </section>

    <div id="branch-tabs" class="explain-branches" role="tablist" aria-label="已保留的思路"></div>

    <section id="board" aria-label="你的解题板书"></section>

    <section id="frontier" class="explain-frontier" aria-label="选择下一步">
      <p id="feedback" class="explain-feedback" role="status" aria-live="polite"></p>

      <div id="focus-banner" class="explain-focus" hidden>
        <p id="focus-text"></p>
        <button id="leave-focus" type="button">先跳过，继续往下做</button>
      </div>
      <div id="thread" class="explain-thread" aria-label="系统反馈"></div>
      <div id="attempts"></div>
      <div id="clarify"></div>

      <div class="explain-composer">
        <div id="selected" class="explain-selected" aria-label="已选中的对象"></div>
        <h3 class="explain-subhead">我想：</h3>
        <p id="generation-status" class="explain-note" role="status" aria-live="polite" hidden></p>
        <div id="candidates" class="explain-candidate-ops" role="group" aria-label="我想做的数学操作"></div>
        <details id="own" class="explain-tools">
        <summary>自己写一步</summary>
      <div class="explain-section-head"><h2 id="frontier-title">可选对象</h2><span class="explain-note">点选下方的数学对象</span></div>
      <div id="current-expression" class="explain-formula" aria-label="当前式子，可点选其中的项"></div>
      <div id="conditions" class="explain-conditions"></div>

        <p class="explain-note explain-workbench-tip">先点选要用的对象（可以不选），再选要做什么。</p>
        <div id="actions" class="explain-actions" role="group" aria-label="自己写一步">
          <button type="button" data-op="claim">核对一个等式</button>
          <button type="button" data-op="substitute">设新变量</button>
          <button type="button" data-op="multiply">给式子乘一个因子</button>
          <button type="button" data-op="expand">展开</button>
          <button type="button" data-op="combine">合并同分母的项</button>
          <button type="button" data-op="amgm">用基本不等式</button>
          <button type="button" data-op="attain">检查取等</button>
        </div>
        <form id="template" class="explain-template" hidden>
          <div id="template-line" class="explain-template-line"></div>
          <p class="explain-note">点空格选中它，再点上面式子里的项或下面的按键填写。</p>
          <div id="keypad" class="explain-keypad"></div>
          <div class="explain-send-row">
            <button id="template-cancel" type="button" class="explain-quiet">取消</button>
            <button class="primary" type="submit">提交这一步</button>
          </div>
        </form>
        </details>
        <div class="explain-send-row">
          <button id="help" type="button">给点提示</button>
          <button id="undo" type="button" class="explain-quiet">撤回上一步</button>
        </div>
        <p id="network-status" role="status" aria-live="polite"></p>
        <button id="retry" type="button" hidden>重试这次提交</button>
      </div>
    </section>
    <p class="explain-footnote">推导和选项由 AI 生成，尚未经独立数学验算。讲解暂存在本次服务会话中，刷新页面或服务重启后需重新开始。</p>
  </main>
</body>
</html>
