    <script type="application/json" id="kn-drill-data">{"label":"基本不等式","items":[{"id":"apply","question":"$x>0$ 时，$x+\\frac9x$ 的最小值是多少？","type":"choice","options":[{"value":"nine","label":"$9$","feedback":"$x+\\frac9x\\ge2\\sqrt{x\\cdot\\frac9x}=2\\sqrt9$，不要漏掉开方。"},{"value":"right","label":"$6$"},{"value":"ten","label":"$10$","feedback":"$10$ 是 $x=1$ 时的值。取等要 $x=\\frac9x$，即 $x=3$，值为 $6$。"}],"answer":"right"},{"id":"positive","question":"$x\u003c0$ 时，$x+\\frac1x$ 的取值范围是什么？","type":"choice","options":[{"value":"ge2","label":"$x+\\frac1x\\ge2$","feedback":"两项都是负数，不满足一正。先看 $-x>0$：$-x+\\frac1{-x}\\ge2$。"},{"value":"geneg","label":"$x+\\frac1x\\ge-2$","feedback":"$x=-4$ 时 $x+\\frac1x=-\\frac{17}4\u003c-2$。由 $-x+\\frac1{-x}\\ge2$ 两边乘 $-1$，要变向。"},{"value":"right","label":"$x+\\frac1x\\le-2$"}],"answer":"right"},{"id":"fixed","question":"$0\u003cx\u003c\\frac12$ 时，$x(1-2x)$ 的最大值是多少？","type":"choice","options":[{"value":"right","label":"$\\frac18$"},{"value":"quarter","label":"$\\frac14$","feedback":"$2x(1-2x)\\le\\left(\\frac{2x+1-2x}2\\right)^2=\\frac14$，原式是它的一半。"},{"value":"none","label":"取不到最大值","feedback":"取等要 $2x=1-2x$，即 $x=\\frac14$，在 $\\left(0,\\frac12\\right)$ 里，取得到。"}],"answer":"right"},{"id":"equal","question":"$f(x)=\\sqrt{x^2+4}+\\frac1{\\sqrt{x^2+4}}$ 的最小值是多少？","type":"choice","options":[{"value":"two","label":"$2$","feedback":"取等要 $\\sqrt{x^2+4}=1$，但 $\\sqrt{x^2+4}\\ge2$，做不到。"},{"value":"right","label":"$\\frac52$"},{"value":"none","label":"没有最小值","feedback":"令 $t=\\sqrt{x^2+4}\\ge2$，$t+\\frac1t$ 在 $[2,+\\infty)$ 上递增，$t=2$（$x=0$）时取到 $\\frac52$。"}],"answer":"right"},{"id":"sum-fixed","question":"$a>0$，$b>0$，$a+b=6$，$ab$ 的最大值是多少？","type":"choice","options":[{"value":"square","label":"$36$","feedback":"$(a+b)^2=36$，但 $ab\\le\\left(\\frac{a+b}2\\right)^2$，要先除以 $2$ 再平方。"},{"value":"three","label":"$3$","feedback":"$3$ 是取等时 $a$、$b$ 的值，最大值是 $3\\times3$。"},{"value":"right","label":"$9$"}],"answer":"right"},{"id":"shift","question":"$x>1$ 时，$x+\\frac4{x-1}$ 的最小值是多少？","type":"choice","options":[{"value":"four","label":"$4$","feedback":"$(x-1)+\\frac4{x-1}\\ge4$，原式还要再加 $1$。"},{"value":"right","label":"$5$"},{"value":"six","label":"$6$","feedback":"$6$ 是 $x=2$ 时的值。取等要 $x-1=\\frac4{x-1}$，即 $x=3$，值为 $5$。"}],"answer":"right"},{"id":"twice","given":"$a>0$，$b>0$。有人写：$\\left(a+\\frac1b\\right)\\left(b+\\frac4a\\right)\\ge2\\sqrt{\\frac ab}\\cdot2\\sqrt{\\frac{4b}a}=8$。","question":"能说最小值是 $8$ 吗？","type":"choice","options":[{"value":"right","label":"不能，展开得 $ab+\\frac4{ab}+5\\ge9$，最小值是 $9$"},{"value":"yes","label":"能，最小值是 $8$","feedback":"第一次取等要 $ab=1$，第二次要 $ab=4$，两个等号不能同时成立，$8$ 取不到。"},{"value":"four","label":"不能，最小值是 $4$","feedback":"展开后 $ab+\\frac4{ab}\\ge4$，还有常数 $5$。"}],"answer":"right"},{"id":"statements","question":"下面哪些说法是对的？","type":"multi","options":[{"value":"amgm","label":"$a,b>0$ 时，$a+b\\ge2\\sqrt{ab}$"},{"value":"square","label":"$a^2+b^2\\ge2ab$ 也要求 $a,b>0$","feedback":"$a^2+b^2-2ab=(a-b)^2\\ge0$，对任意实数都成立。"},{"value":"product","label":"$a,b>0$ 时，$ab\\le\\left(\\frac{a+b}2\\right)^2$"},{"value":"recip","label":"$a\\ne0$ 时，$a+\\frac1a\\ge2$","feedback":"$a\u003c0$ 时 $a+\\frac1a\\le-2$。要 $a>0$ 才有 $a+\\frac1a\\ge2$。"}],"answer":["amgm","product"]}]}</script>
