    <script type="application/json" id="kn-drill-data">{"label":"恒成立、存在成立与函数值域的关系","items":[{"id":"forall-gt-closed","given":"$y=f(x)$ 在 $[1,3]$ 上的图像是一段连续曲线，有最大值和最小值。","question":"要使 $f(x)>0$ 对所有 $x\\in[1,3]$ 成立，$f(x)$ 应满足哪个条件？","type":"choice","options":[{"value":"max","label":"$x\\in[1,3]$ 时，$f(x)_{\\max}>0$","feedback":"最大值大于 $0$ 只保证最高的那一处在横轴上方，别处仍可能在下方。"},{"value":"ends","label":"$f(1)>0$ 且 $f(3)>0$","feedback":"两个端点在横轴上方，中间仍可能有一段跑到下方，比如开口向上、顶点在区间内的抛物线。"},{"value":"min","label":"$x\\in[1,3]$ 时，$f(x)_{\\min}>0$"}],"answer":"min"},{"id":"forall-le-parameter","given":"$y=h(x)$ 在 $[0,2]$ 上的图像是一段连续曲线，有最大值和最小值。","question":"要使 $m\\ge h(x)$ 对所有 $x\\in[0,2]$ 成立，$m$ 应满足哪个条件？","type":"choice","options":[{"value":"max","label":"$x\\in[0,2]$ 时，$m\\ge h(x)_{\\max}$"},{"value":"min","label":"$x\\in[0,2]$ 时，$m\\ge h(x)_{\\min}$","feedback":"$m$ 不低于最低处，比最低处高的那些 $h(x)$ 仍可能超过 $m$。"},{"value":"one","label":"$m\\ge h(1)$","feedback":"只检查了 $x=1$ 一个点，区间里别的 $x$ 仍可能使 $h(x)>m$。"}],"answer":"max"},{"id":"exists-lt-closed","given":"$y=f(x)$ 在 $[-1,2]$ 上的图像是一段连续曲线，有最大值和最小值。","question":"要使存在 $x\\in[-1,2]$，使 $f(x)\u003c0$，$f(x)$ 应满足哪个条件？","type":"choice","options":[{"value":"max","label":"$x\\in[-1,2]$ 时，$f(x)_{\\max}\u003c0$","feedback":"最大值小于 $0$ 说明整段都在横轴下方，这是恒成立的要求；存在只要一处在下方。"},{"value":"min","label":"$x\\in[-1,2]$ 时，$f(x)_{\\min}\u003c0$"},{"value":"one","label":"$f(0)\u003c0$","feedback":"$f(0)\u003c0$ 时确实存在，但 $f(0)\\ge0$ 时别处仍可能小于 $0$，所以它不是必须满足的条件。"}],"answer":"min"},{"id":"exists-gt-open","question":"要使存在 $x\\in(1,2)$，使 $f(x)>0$，$f(x)$ 应满足哪个条件？","type":"choice","options":[{"value":"min","label":"$x\\in(1,2)$ 时，$f(x)$ 取值范围的下端 $>0$","feedback":"下端也大于 $0$ 是所有点都满足，这是恒成立的要求；存在只要一处满足。"},{"value":"one","label":"$f\\left(\\frac32\\right)>0$","feedback":"一个点不满足，别处仍可能满足，所以不能只看 $x=\\frac32$。"},{"value":"max","label":"$x\\in(1,2)$ 时，$f(x)$ 取值范围的上端 $>0$"}],"answer":"max"},{"id":"exists-ge-parameter","given":"$y=g(x)$ 在 $[1,4]$ 上的图像是一段连续曲线，有最大值和最小值。","question":"要使存在 $x\\in[1,4]$，使 $a\\le g(x)$，$a$ 应满足哪个条件？","type":"choice","options":[{"value":"min","label":"$x\\in[1,4]$ 时，$a\\le g(x)_{\\min}$","feedback":"$a\\le g(x)_{\\min}$ 能保证所有 $x$ 都满足，是恒成立的条件；存在的要求更低。"},{"value":"max","label":"$x\\in[1,4]$ 时，$a\\le g(x)_{\\max}$"},{"value":"ends","label":"$a\\le g(1)$ 且 $a\\le g(4)$","feedback":"最大值可能在区间中间取到；那时 $a$ 比两个端点值都大，也可能存在满足的 $x$。"}],"answer":"max"},{"id":"forall-negative","given":"$y=h(x)$ 在 $[1,2]$ 上的图像是一段连续曲线，有最大值和最小值。","question":"要使 $m\u003c-h(x)$ 对所有 $x\\in[1,2]$ 成立，$m$ 应满足哪个条件？","type":"choice","options":[{"value":"min","label":"$x\\in[1,2]$ 时，$m\u003c-h(x)_{\\min}$","feedback":"$m\u003c-h(x)$ 即 $h(x)\u003c-m$：整段 $h(x)$ 都要在 $y=-m$ 下方，要比的是 $h(x)$ 的最高点。加负号后，最大变最小。"},{"value":"max","label":"$x\\in[1,2]$ 时，$m\u003c-h(x)_{\\max}$"},{"value":"one","label":"$m\u003c-h(2)$","feedback":"只检查了 $x=2$ 一个点，区间里别的 $x$ 仍可能不满足。"}],"answer":"max"},{"id":"forall-ge-unattained","given":"已知 $f(x)$ 在 $(-\\infty,0)$ 上单调递减。","question":"要使 $f(x)\\ge0$ 对所有 $x\\in(-\\infty,0)$ 成立，$f(x)$ 应满足哪个条件？","type":"choice","options":[{"value":"max","label":"$x\\in(-\\infty,0)$ 时，$f(x)$ 取值范围的上端 $\\ge0$","feedback":"恒成立要看最低处。$f(x)$ 递减，$x$ 越往左越大，上端不起作用。"},{"value":"min","label":"$x\\in(-\\infty,0)$ 时，$f(x)$ 取值范围的下端 $\\ge0$"},{"value":"one","label":"$f(-1)\\ge0$","feedback":"$x$ 从 $-1$ 往右靠近 $0$ 时 $f(x)$ 继续变小，只看 $x=-1$ 不够。"}],"answer":"min"},{"id":"forall-equivalent","given":"$y=f(x)$ 在 $[1,2]$ 上的图像是一段连续曲线，有最大值和最小值。","question":"下面哪些条件与“$f(x)>0$ 对所有 $x\\in[1,2]$ 成立”意思相同？选出所有正确的。","type":"multi","options":[{"value":"min","label":"$x\\in[1,2]$ 时，$f(x)_{\\min}>0$"},{"value":"ends","label":"$f(1)>0$ 且 $f(2)>0$","feedback":"端点在上方，中间仍可能有一段在下方，这一项不够。"},{"value":"graph","label":"$y=f(x)$ 在 $[1,2]$ 上的图像都在 $x$ 轴上方"},{"value":"max","label":"$x\\in[1,2]$ 时，$f(x)_{\\max}>0$","feedback":"最大值大于 $0$ 只保证一处在上方，这是“存在”的条件。"}],"answer":["min","graph"]}]}</script>
