    <script type="application/json" id="kn-drill-data">{"label":"函数的单调性","items":[{"id":"definition","given":"$f(x)$ 在 $[0,4]$ 上递增。","question":"下面哪个一定成立？","type":"choice","options":[{"value":"right","label":"$f(1)\u003cf(3)$"},{"value":"flip","label":"$f(1)>f(3)$","feedback":"递增：自变量大，函数值也大。"},{"value":"outside","label":"$f(-1)\u003cf(1)$","feedback":"$-1$ 不在 $[0,4]$ 里，题目没有告诉 $f(x)$ 在那里的情况。"}],"answer":"right"},{"id":"range-closed","given":"$f(x)$ 在 $[1,5]$ 上递减，$f(1)=7$，$f(5)=-1$。","question":"$f(x)$ 在 $[1,5]$ 上的取值范围是什么？（$f(x)$ 的图像连续）","type":"choice","options":[{"value":"open","label":"$(-1,7)$","feedback":"闭区间的两个端点都取得到，$-1$ 和 $7$ 都要算进去。"},{"value":"right","label":"$[-1,7]$"},{"value":"unknown","label":"不能确定","feedback":"单调函数在区间上的取值范围由端点决定：递减时从 $f(1)$ 降到 $f(5)$。"}],"answer":"right"},{"id":"sum","question":"$f(x)=x+\\sqrt x$ 在 $[0,+\\infty)$ 上的单调性是？","type":"choice","options":[{"value":"right","label":"递增"},{"value":"down","label":"递减","feedback":"$x$ 和 $\\sqrt x$ 在 $[0,+\\infty)$ 上都递增，两个递增函数的和也递增。"},{"value":"mixed","label":"先减后增","feedback":"两项都随 $x$ 增大而增大，和不会减小。"}],"answer":"right"},{"id":"reciprocal","question":"$g(x)=\\frac1{x^2+1}$ 在 $[0,2]$ 上的最小值是多少？","type":"choice","options":[{"value":"left","label":"$1$","feedback":"$g(0)=1$ 是最大值。$x^2+1$ 在 $[0,2]$ 上递增且为正，取倒数后递减。"},{"value":"right","label":"$\\frac15$"},{"value":"middle","label":"$\\frac12$","feedback":"$\\frac12$ 是 $x=1$ 处的值。$g(x)$ 在区间上递减，最小值在右端。"}],"answer":"right"},{"id":"negative","question":"$f(x)$ 在某区间上递增，$-2f(x)$ 在这个区间上怎样？","type":"choice","options":[{"value":"up","label":"递增","feedback":"乘负数，大小顺序颠倒：$f(x_1)\u003cf(x_2)$ 推出 $-2f(x_1)>-2f(x_2)$。"},{"value":"right","label":"递减"},{"value":"unknown","label":"不能确定","feedback":"乘一个确定的负数，单调性一定反过来。"}],"answer":"right"},{"id":"composite","question":"$y=\\frac1{x^2-2x}$ 在 $[3,4]$ 上的最大值是多少？","type":"choice","options":[{"value":"far","label":"$\\frac18$","feedback":"$\\frac18$ 是 $x=4$ 处的值，是最小值。"},{"value":"right","label":"$\\frac13$"},{"value":"vertex","label":"$-1$","feedback":"$-1$ 是 $x=1$ 处的值，$x=1$ 不在 $[3,4]$ 里。$x^2-2x$ 在 $[3,4]$ 上从 $3$ 增大到 $8$，取倒数后递减。"}],"answer":"right"},{"id":"domain-trap","question":"下面哪一句是对的？","type":"choice","options":[{"value":"domain","label":"$\\frac1x$ 在定义域上递减","feedback":"$-1\u003c1$，而 $\\frac1{-1}\u003c\\frac11$，不满足递减。只能分别说在两个区间上递减。"},{"value":"neg","label":"$\\frac1x$ 在 $(-\\infty,0)$ 上递增","feedback":"$-2\u003c-1$，$\\frac1{-2}=-\\frac12>-1$，在 $(-\\infty,0)$ 上也是递减。"},{"value":"right","label":"$\\frac1x$ 在 $(0,+\\infty)$ 上递减"}],"answer":"right"},{"id":"statements","given":"$f(x)$ 在 $[1,3]$ 上递增，$f(1)=2$，$f(3)=6$。只看 $x\\in(1,3)$。","question":"下面哪些说法是对的？","type":"multi","options":[{"value":"between","label":"对 $(1,3)$ 中任意 $x$，$2\u003cf(x)\u003c6$"},{"value":"min","label":"$f(x)$ 在 $(1,3)$ 上的最小值是 $2$","feedback":"$x=1$ 不在 $(1,3)$ 里，$f(x)$ 取不到 $2$，在 $(1,3)$ 上没有最小值。"},{"value":"order","label":"$f(2)\u003cf(2.5)$"},{"value":"reach","label":"存在 $x\\in(1,3)$ 使 $f(x)=6$","feedback":"递增时 $x\u003c3$ 就有 $f(x)\u003cf(3)=6$。"}],"answer":["between","order"]}]}</script>
