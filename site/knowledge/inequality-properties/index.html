    <script type="application/json" id="kn-drill-data">{"label":"不等式的性质","items":[{"id":"mul-neg","given":"$a\u003cb$。","question":"下面哪个一定成立？","type":"choice","options":[{"value":"keep","label":"$-2a\u003c-2b$","feedback":"两边乘负数，不等号要反向。"},{"value":"right","label":"$-2a>-2b$"},{"value":"square","label":"$a^2\u003cb^2$","feedback":"$a=-3$，$b=1$ 时 $a^2>b^2$。两边都非负才能直接平方。"}],"answer":"right"},{"id":"divide-x","question":"$x\u003c0$ 时，$mx>x^2+1$ 两边除以 $x$，得到哪个不等式？","type":"choice","options":[{"value":"keep","label":"$m>x+\\frac1x$","feedback":"$x\u003c0$，除以负数不等号要反向。"},{"value":"right","label":"$m\u003cx+\\frac1x$"},{"value":"partial","label":"$m\u003cx+1$","feedback":"右边每一项都要除以 $x$：$\\frac{x^2+1}x=x+\\frac1x$。"}],"answer":"right"},{"id":"unknown-sign","question":"$x\\in(-1,2)$ 时，由 $mx\\le3$ 求 $m$，能不能直接两边除以 $x$？","type":"choice","options":[{"value":"keep","label":"能，得到 $m\\le\\frac3x$","feedback":"$x$ 在 $(-1,2)$ 里可正、可负、可为 $0$，除以负数要变向，$x=0$ 时不能除。"},{"value":"flip","label":"能，得到 $m\\ge\\frac3x$","feedback":"只有 $x\u003c0$ 时才变向；$x$ 的符号不确定。"},{"value":"right","label":"不能，要按 $x>0$、$x=0$、$x\u003c0$ 分类"}],"answer":"right"},{"id":"reciprocal","question":"$2\u003ca\u003c5$，$\\frac1a$ 的取值范围是什么？","type":"choice","options":[{"value":"right","label":"$\\frac15\u003c\\frac1a\u003c\\frac12$"},{"value":"keep","label":"$\\frac12\u003c\\frac1a\u003c\\frac15$","feedback":"$\\frac12>\\frac15$，这个范围是空的。同正取倒数，大小顺序颠倒。"},{"value":"half","label":"$\\frac1a>\\frac12$","feedback":"$a=4$ 时 $\\frac1a=\\frac14\u003c\\frac12$。$a$ 越大，$\\frac1a$ 越小。"}],"answer":"right"},{"id":"reciprocal-mixed","question":"$-2\u003ca\u003c3$ 且 $a\\ne0$，$\\frac1a$ 的取值范围是什么？","type":"choice","options":[{"value":"direct","label":"$-\\frac12\u003c\\frac1a\u003c\\frac13$","feedback":"两端异号，不能直接取倒数。$a=1$ 时 $\\frac1a=1$，不在这个范围里。"},{"value":"right","label":"$\\frac1a\u003c-\\frac12$ 或 $\\frac1a>\\frac13$"},{"value":"lower","label":"$\\frac1a>-\\frac12$","feedback":"$a=-1$ 时 $\\frac1a=-1\u003c-\\frac12$。要把 $a\u003c0$ 和 $a>0$ 分开取倒数。"}],"answer":"right"},{"id":"add","question":"$1\u003ca\u003c3$，$2\u003cb\u003c4$，$a+b$ 的取值范围是什么？","type":"choice","options":[{"value":"sub","label":"$-1\u003ca+b\u003c-1$","feedback":"这是把两个不等式相减得到的，而且范围是空的。同向不等式可以直接相加。"},{"value":"mixed","label":"$5\u003ca+b\u003c5$","feedback":"下端加下端、上端加上端：$1+2\u003ca+b\u003c3+4$。"},{"value":"right","label":"$3\u003ca+b\u003c7$"}],"answer":"right"},{"id":"subtract","question":"$1\u003ca\u003c3$，$2\u003cb\u003c4$，$a-b$ 的取值范围是什么？","type":"choice","options":[{"value":"right","label":"$-3\u003ca-b\u003c1$"},{"value":"direct","label":"$-1\u003ca-b\u003c-1$","feedback":"不能把两个不等式直接相减。先由 $2\u003cb\u003c4$ 得 $-4\u003c-b\u003c-2$，再与 $1\u003ca\u003c3$ 相加。"},{"value":"half","label":"$-1\u003ca-b\u003c1$","feedback":"下端应是 $1+(-4)=-3$：$a$ 取小、$b$ 取大时 $a-b$ 最小。"}],"answer":"right"},{"id":"statements","given":"$a>b$，$c$ 是任意实数。","question":"下面哪些一定成立？","type":"multi","options":[{"value":"add","label":"$a+c>b+c$"},{"value":"mul","label":"$ac>bc$","feedback":"$c\\le0$ 时不成立：$c\u003c0$ 要变向，$c=0$ 时两边相等。"},{"value":"sub","label":"$a-c>b-c$"},{"value":"recip","label":"$\\frac1a\u003c\\frac1b$","feedback":"要 $a$、$b$ 同号才成立，例如 $a=1$，$b=-1$ 时 $\\frac1a>\\frac1b$。"}],"answer":["add","sub"]}]}</script>
