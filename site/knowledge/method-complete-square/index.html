    <script type="application/json" id="kn-drill-data">{"label":"配方","items":[{"id":"basic","question":"把 $x^2-4x+7$ 配方，结果是什么？","type":"choice","options":[{"value":"right","label":"$(x-2)^2+3$"},{"value":"whole","label":"$(x-4)^2-9$","feedback":"括号里是一次项系数的一半：$-4$ 的一半是 $-2$。"},{"value":"sign","label":"$(x+2)^2+3$","feedback":"$(x+2)^2$ 展开是 $x^2+4x+4$，一次项符号不对。"}],"answer":"right"},{"id":"min","question":"$x^2+2x+5$ 的最小值是多少？","type":"choice","options":[{"value":"c","label":"$5$","feedback":"$5$ 是 $x=0$ 时的值。配方得 $(x+1)^2+4$。"},{"value":"right","label":"$4$"},{"value":"where","label":"$-1$","feedback":"$-1$ 是取最小值时 $x$ 的值。"}],"answer":"right"},{"id":"leading-neg","question":"把 $-x^2+4x+1$ 配方，结果是什么？","type":"choice","options":[{"value":"forgot","label":"$-(x-2)^2-3$","feedback":"$-(x^2-4x)+1=-[(x-2)^2-4]+1$，括号外的负号乘进去，$-4$ 变成 $+4$。"},{"value":"sign","label":"$-(x+2)^2+5$","feedback":"$x^2-4x$ 配成的是 $(x-2)^2$。"},{"value":"right","label":"$-(x-2)^2+5$"}],"answer":"right"},{"id":"leading-two","question":"把 $2x^2-4x+5$ 配方，结果是什么？","type":"choice","options":[{"value":"right","label":"$2(x-1)^2+3$"},{"value":"forgot","label":"$2(x-1)^2+4$","feedback":"$2(x^2-2x)+5=2[(x-1)^2-1]+5$，减去的 $1$ 也要乘 $2$。"},{"value":"inside","label":"$(2x-1)^2+4$","feedback":"$(2x-1)^2=4x^2-4x+1$，二次项系数是 $4$，不对。先把系数 $2$ 提出来。"}],"answer":"right"},{"id":"equality","question":"$(x-3)^2-2\\ge-2$，什么时候取等号？","type":"choice","options":[{"value":"sign","label":"$x=-3$","feedback":"平方项为 $0$ 时取等：$x-3=0$。"},{"value":"right","label":"$x=3$"},{"value":"const","label":"$x=-2$","feedback":"$-2$ 是最小值，不是取等时 $x$ 的值。"}],"answer":"right"},{"id":"restricted","question":"$x^2-6x$ 在 $[4,5]$ 上的最小值是多少？","type":"choice","options":[{"value":"vertex","label":"$-9$","feedback":"$(x-3)^2-9\\ge-9$ 在 $x=3$ 取等，但 $x=3$ 不在 $[4,5]$ 里。"},{"value":"right","label":"$-8$"},{"value":"far","label":"$-5$","feedback":"$f(5)=-5$ 是区间上的最大值。"}],"answer":"right"},{"id":"positive","question":"要说明 $x^2+x+1>0$ 对一切实数成立，把它配方成什么？","type":"choice","options":[{"value":"right","label":"$\\left(x+\\frac12\\right)^2+\\frac34$"},{"value":"wrong-c","label":"$\\left(x+\\frac12\\right)^2+\\frac54$","feedback":"加上 $\\frac14$ 配成平方，还要再减去 $\\frac14$：$1-\\frac14=\\frac34$。"},{"value":"whole","label":"$(x+1)^2$","feedback":"$(x+1)^2=x^2+2x+1$，一次项不对。"}],"answer":"right"},{"id":"statements","given":"把二次式配方成 $a(x-h)^2+k$。","question":"下面哪些说法是对的？","type":"multi","options":[{"value":"up","label":"$x$ 取全体实数、$a>0$ 时，最小值是 $k$"},{"value":"always","label":"不论 $x$ 的范围，最值一定是 $k$","feedback":"$x=h$ 不在范围里时取不到 $k$，要按区间求最值。"},{"value":"down","label":"$x$ 取全体实数、$a\u003c0$ 时，得到的是最大值 $k$"},{"value":"add-only","label":"配方时只要加上一次项系数一半的平方，不用再减","feedback":"加了多少就要减多少，式子的值才不变。"}],"answer":["up","down"]}]}</script>
