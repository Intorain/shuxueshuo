    <script type="application/json" id="kn-drill-data">{"label":"判别式法","items":[{"id":"fixed-coefficient","question":"不等式 $2x^2-ax+1>0$ 对任意实数 $x$ 恒成立。能直接用判别式法吗？","type":"choice","options":[{"value":"discuss","label":"要先讨论 $x^2$ 的系数为 $0$ 的情形","feedback":"$x^2$ 的系数是 $2$，不含参数，不会为 $0$；参数 $a$ 在一次项里，不影响能否用判别式。"},{"value":"yes","label":"能：$x$ 取全体实数，$x^2$ 的系数 $2$ 确定非零"},{"value":"no","label":"不能：含参数的不等式不能用判别式","feedback":"参数在哪一项都可以。判别式法只看两件事：$x$ 是否取全体实数，$x^2$ 的系数是否确定非零。"}],"answer":"yes"},{"id":"coefficient-maybe-zero","question":"不等式 $(m-1)x^2+mx+m>0$ 对任意实数 $x$ 恒成立。怎样用判别式法？","type":"choice","options":[{"value":"direct","label":"直接用开口方向和 $\\Delta$ 列条件","feedback":"$x^2$ 的系数 $m-1$ 可能为 $0$，那时不再是二次式，开口和 $\\Delta$ 都无从谈起。"},{"value":"no","label":"不能用判别式法","feedback":"$x$ 取全体实数；把系数为 $0$ 的情形单独讨论后，其余情形仍可用判别式。"},{"value":"discuss","label":"先讨论 $m-1=0$，再对 $m\\ne1$ 用开口方向和 $\\Delta$"}],"answer":"discuss"},{"id":"interval-not-enough","question":"当 $0\\le x\\le2$ 时，不等式 $x^2-2ax+3>0$ 恒成立。能用“$\\Delta\u003c0$”作为条件吗？","type":"choice","options":[{"value":"no","label":"不能：$x$ 只在区间上取值，只看判别式不够"},{"value":"yes","label":"能：$x^2$ 的系数是 $1$，确定非零","feedback":"系数没问题，但 $x$ 只在 $[0,2]$ 上取值。$\\Delta$ 管的是整条抛物线，区间外的部分在横轴下方也不要紧，用 $\\Delta\u003c0$ 会漏掉一些符合要求的 $a$。"},{"value":"le","label":"能，但要改成 $\\Delta\\le0$","feedback":"问题不在等号：$x$ 只在 $[0,2]$ 上取值，而判别式管的是整条图像。"}],"answer":"no"},{"id":"tangent-allowed","question":"不等式 $x^2+ax+1\\ge0$ 对任意实数 $x$ 恒成立。用判别式法应列出哪个条件？","type":"choice","options":[{"value":"lt","label":"$\\Delta=a^2-4\u003c0$","feedback":"原不等式带等号，图像可以与横轴相切，$\\Delta=0$ 也满足。"},{"value":"ge","label":"$\\Delta=a^2-4\\ge0$","feedback":"$\\Delta>0$ 时抛物线与横轴有两个交点，两点之间的一段在横轴下方，不满足 $\\ge0$。"},{"value":"le","label":"$\\Delta=a^2-4\\le0$"}],"answer":"le"},{"id":"opening-matters","given":"已知 $a\\ne0$。","question":"不等式 $ax^2+2x+1\u003c0$ 对任意实数 $x$ 恒成立，应满足哪个条件？","type":"choice","options":[{"value":"up","label":"$a>0$ 且 $\\Delta\u003c0$","feedback":"开口向上时，抛物线往两边无限升高，不可能整条在横轴下方。"},{"value":"down","label":"$a\u003c0$ 且 $\\Delta\u003c0$"},{"value":"delta","label":"只要 $\\Delta=4-4a\u003c0$","feedback":"$\\Delta\u003c0$ 只说明图像与横轴没有交点；开口向上时整条图像在横轴上方，不满足 $\u003c0$，所以还要 $a\u003c0$。"}],"answer":"down"}]}</script>
