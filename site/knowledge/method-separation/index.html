    <script type="application/json" id="kn-drill-data">{"label":"分离参数法","items":[{"id":"divide-positive","question":"当 $x\\in[1,3]$ 时，不等式 $ax+2x^2-1>0$ 恒成立。能用分离参数法吗？","type":"choice","options":[{"value":"yes","label":"能：移项后除以 $x$，而 $x>0$，不等号方向不变"},{"value":"tangled","label":"不能：参数和 $x$ 乘在一起，分不开","feedback":"$ax$ 移项后除以 $x$，就能把 $a$ 单独放到一边；$x\\in[1,3]$ 时 $x>0$，可以直接除。"},{"value":"flip","label":"能，但除以 $x$ 后不等号要变向","feedback":"$x\\in[1,3]$ 时 $x>0$，除以正数不等号不变向。"}],"answer":"yes"},{"id":"divide-negative","question":"当 $x\\in[-2,-1]$ 时，不等式 $ax-x^2+3\u003c0$ 恒成立。把 $a$ 分离出来，得到的是哪个？","type":"choice","options":[{"value":"lt","label":"$a\u003c\\dfrac{x^2-3}{x}$","feedback":"$x\\in[-2,-1]$ 时 $x\u003c0$，除以负数不等号要变向。"},{"value":"gt","label":"$a>\\dfrac{x^2-3}{x}$"},{"value":"unknown","label":"$x$ 的符号不定，要分类讨论","feedback":"$x$ 在 $[-2,-1]$ 上恒为负，符号确定，不用分类。"}],"answer":"gt"},{"id":"unknown-sign","question":"不等式 $kx^2+2kx-(k+2)\u003c0$ 对任意实数 $x$ 恒成立。能直接用分离参数法吗？","type":"choice","options":[{"value":"yes","label":"能：提出 $k$ 后除以 $x^2+2x-1$","feedback":"$x^2+2x-1$ 在实数范围内有正有负，也会等于 $0$，不能直接除。"},{"value":"separated","label":"能：参数已经分离","feedback":"$k$ 出现在三项里，还要提出来再除，参数并没有分离。"},{"value":"no","label":"不能直接用：要除的 $x^2+2x-1$ 符号不定"}],"answer":"no"},{"id":"already-separated","question":"不等式 $x^2-2x+3\\ge a^2-a$ 对任意实数 $x$ 恒成立。能用分离参数法吗？","type":"choice","options":[{"value":"quadratic","label":"不能：右边是关于 $a$ 的二次式","feedback":"参数那一边是什么样的式子都可以，只要另一边只含 $x$；最后解关于 $a$ 的不等式即可。"},{"value":"yes","label":"能：参数已经分离，左边只含 $x$，右边只含 $a$"},{"value":"sign","label":"要先讨论 $a$ 的正负","feedback":"不涉及除法，不需要讨论符号。"}],"answer":"yes"},{"id":"cannot-separate","question":"下面哪个不等式不能用分离参数法把 $a$ 单独放到一边？","type":"choice","options":[{"value":"linear","label":"$ax+x^2>1$（$x\\in[1,2]$）","feedback":"移项后除以 $x$（$x>0$）即可分离：$a>\\dfrac{1-x^2}{x}$。"},{"value":"moved","label":"$a-x^2+2x\\ge0$（$x\\in\\mathbb R$）","feedback":"移项即得 $a\\ge x^2-2x$，参数已经单独在一边。"},{"value":"tangled","label":"$x^2-ax+a^2>0$（$x\\in[1,2]$）"}],"answer":"tangled"}]}</script>
