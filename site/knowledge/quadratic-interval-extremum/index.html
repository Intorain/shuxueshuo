    <script type="application/json" id="kn-drill-data">{"label":"二次函数在区间上的最值与值域","items":[{"id":"min-axis-right","question":"$f(x)=x^2-4x+1$ 在 $[0,1]$ 上的最小值是多少？","type":"choice","options":[{"value":"vertex","label":"$-3$","feedback":"$-3$ 是顶点值 $f(2)$，但 $x=2$ 不在 $[0,1]$ 里。对称轴在区间右侧，函数在区间上递减。"},{"value":"right","label":"$-2$"},{"value":"left","label":"$1$","feedback":"$f(0)=1$ 是区间上的最大值。"}],"answer":"right"},{"id":"max-midpoint","question":"$f(x)=x^2-2x$ 在 $[-1,2]$ 上的最大值是多少？","type":"choice","options":[{"value":"near","label":"$0$","feedback":"$f(2)=0$。对称轴 $x=1$ 在区间中点 $\\frac12$ 的右侧，左端点 $-1$ 离对称轴更远。"},{"value":"vertex","label":"$-1$","feedback":"开口向上时顶点是最低点，$-1$ 是最小值。"},{"value":"right","label":"$3$"}],"answer":"right"},{"id":"min-compare","given":"开口向上的二次函数 $f(x)$，对称轴是 $x=h$。","question":"$f(x)$ 在 $[1,3]$ 上的最小值是 $f(3)$，$h$ 满足什么？","type":"choice","options":[{"value":"right","label":"$h\\ge3$"},{"value":"mid","label":"$h>2$","feedback":"最小值看对称轴和两个端点的位置：$h=2.5$ 时顶点在区间里，最小值是 $f(2.5)$。"},{"value":"left","label":"$h\\le1$","feedback":"$h\\le1$ 时函数在区间上递增，最小值是 $f(1)$。"}],"answer":"right"},{"id":"max-compare","given":"开口向上的二次函数 $f(x)$，对称轴是 $x=h$。","question":"$f(x)$ 在 $[1,3]$ 上的最大值是 $f(1)$，$h$ 满足什么？","type":"choice","options":[{"value":"end","label":"$h\\ge3$","feedback":"最大值看哪个端点离对称轴远，和区间中点 $2$ 比就够了，$h=2.5$ 时也是 $f(1)$ 最大。"},{"value":"right","label":"$h\\ge2$"},{"value":"wrong","label":"$h\\le2$","feedback":"$h\u003c2$ 时右端点离对称轴更远，最大值是 $f(3)$。"}],"answer":"right"},{"id":"open-interval","question":"$f(x)=x^2-2x$，$x\\in(0,3)$，$f(x)$ 的取值范围是什么？","type":"choice","options":[{"value":"closed","label":"$[-1,3]$","feedback":"$3=f(3)$，而 $x=3$ 不在区间里，取不到。"},{"value":"open","label":"$(-1,3)$","feedback":"对称轴 $x=1$ 在区间里，最小值 $f(1)=-1$ 取得到。"},{"value":"right","label":"$[-1,3)$"}],"answer":"right"},{"id":"opening-down","question":"$f(x)=-x^2+2x$ 在 $[2,4]$ 上的最大值是多少？","type":"choice","options":[{"value":"vertex","label":"$1$","feedback":"$1$ 是顶点值 $f(1)$，但 $x=1$ 不在 $[2,4]$ 里。对称轴在区间左侧，开口向下，函数在区间上递减。"},{"value":"right","label":"$0$"},{"value":"far","label":"$-8$","feedback":"$f(4)=-8$ 是区间上的最小值。"}],"answer":"right"},{"id":"half-infinite","question":"$f(x)=x^2+2x$，$x\\in(0,+\\infty)$，$f(x)$ 的取值范围是什么？","type":"choice","options":[{"value":"closed","label":"$[0,+\\infty)$","feedback":"$0=f(0)$，而 $x=0$ 不在区间里，取不到。"},{"value":"vertex","label":"$[-1,+\\infty)$","feedback":"$-1$ 是顶点值 $f(-1)$，但 $x=-1$ 不在区间里；函数在 $(0,+\\infty)$ 上递增。"},{"value":"right","label":"$(0,+\\infty)$"}],"answer":"right"},{"id":"statements","given":"开口向上的二次函数，在闭区间 $[p,q]$ 上。","question":"下面哪些说法是对的？","type":"multi","options":[{"value":"vertex","label":"最小值一定在顶点处取到","feedback":"对称轴在区间外时，顶点不在区间里，最小值在离对称轴近的端点。"},{"value":"end","label":"最大值一定在某个端点处取到"},{"value":"inside","label":"对称轴在区间里时，最小值是顶点的函数值"},{"value":"mid","label":"对称轴正好在区间中点时，没有最大值","feedback":"这时两个端点的函数值相等，都是最大值。"}],"answer":["end","inside"]}]}</script>
