"label":"$-2$"}],"answer":"right"},{"id":"transform","question":"$h(x)=-x-\\frac8x$（$x\u003c0$）的最小值是多少？","type":"choice","options":[{"value":"sign","label":"$-4\\sqrt2$","feedback":"$-x>0$，$h(x)=(-x)+\\frac8{-x}$ 是两个正数的和，最小值是正数。"},{"value":"right","label":"$4\\sqrt2$"},{"value":"half","label":"$2\\sqrt2$","feedback":"最小值是 $2\\sqrt k=2\\sqrt8=4\\sqrt2$。"}],"answer":"right"},{"id":"statements","given":"$y=x+\\frac4x$。","question":"下面哪些说法是对的？","type":"multi","options":[{"value":"min","label":"在 $(0,+\\infty)$ 上的最小值是 $4$"},{"value":"global","label":"在整个定义域上的最小值是 $4$","feedback":"$x\u003c0$ 时函数值是负数，比 $4$ 小；整个定义域上没有最小值。"},{"value":"mono","label":"在 $(0,2]$ 上递减，在 $[2,+\\infty)$ 上递增"},{"value":"distance","label":"在 $[1,3]$ 上的最大值在离 $x=2$ 更远的端点","feedback":"两端离 $x=2$ 一样远，但 $f(1)=5>f(3)$。图像不对称，要比较两端点之积和 $4$。"}],"answer":["min","mono"]}]}</script>
