<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#000000">
  <title>拍题学 · 数学说</title>
  <link rel="stylesheet" href="search.css">
  <link rel="stylesheet" href="camera.css?v=20261022-preview2">
  <script src="camera.js?v=20261022-errors2" defer></script>
</head>
<body class="sq-page cm-page" data-state="shoot">
  <!-- 取景 -->
  <section class="cm-shoot" id="cm-shoot" aria-label="拍照">
    <video id="cm-video" playsinline muted autoplay></video>
    <img id="cm-sim" alt="" hidden>
    <div class="cm-grid" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <header class="cm-top">
      <a class="cm-round" href="./" aria-label="关闭">✕</a>
      <span class="cm-proto">原型：<a href="?sim=1">模拟取景</a> · <a href="?sim=denied">无相机权限</a></span>
    </header>
    <p class="cm-hint" id="cm-hint">纸面放平，文字对齐参考线<br><small>可以拍整页，拍完再选题</small></p>

    <div class="cm-denied" id="cm-denied" hidden>
      <h1>没有拿到相机权限</h1>
      <p>改用手机相机或相册。</p>
      <label class="sq-primary" for="cm-system">用手机相机拍</label>
      <label class="sq-ghost cm-dark-ghost" for="cm-album">从相册选择</label>
      <small>或在浏览器设置里允许使用相机</small>
    </div>

    <footer class="cm-bar">
      <label class="cm-album" for="cm-album" aria-label="从相册选择">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="m4 17 5-4.5 4 3.5 3-2.5 4 3.5"/></svg>
        <span>相册</span>
      </label>
      <button type="button" class="cm-shutter" id="cm-shutter" aria-label="拍照"><i></i></button>
      <span class="cm-bar-spacer"></span>
    </footer>
    <input id="cm-album" type="file" accept="image/png,image/jpeg,image/webp" hidden>
    <input id="cm-system" type="file" accept="image/*" capture="environment" hidden>
  </section>

  <!-- 选题 / 手动框选 -->
  <section class="cm-pick" id="cm-pick" aria-label="选择题目" hidden>
    <header class="cm-top cm-pick-top">
      <button type="button" class="cm-round" id="cm-retake" aria-label="重拍">‹</button>
      <strong class="cm-title" id="cm-title">点一下要学的题</strong>
      <div class="cm-pick-actions">
        <button type="button" class="cm-pill" id="cm-rotate" aria-label="将照片顺时针旋转 90 度" disabled>↻ 顺时针 90°</button>
        <button type="button" class="cm-pill" id="cm-whole" disabled>使用整张图</button>
      </div>
    </header>

    <div class="cm-stage-wrap" id="cm-stage-wrap">
      <div class="cm-stage" id="cm-stage">
        <img id="cm-photo" alt="拍到的照片" draggable="false">
        <div class="cm-boxes" id="cm-boxes"></div>
        <div class="sq-crop-box cm-crop" id="cm-crop" hidden aria-label="题目范围">
          <span data-handle="nw"></span><span data-handle="ne"></span><span data-handle="sw"></span><span data-handle="se"></span>
        </div>
        <div class="cm-finding" id="cm-finding"><span class="cm-scanline" aria-hidden="true"></span></div>
      </div>
    </div>

    <div class="cm-sheet" id="cm-sheet">
      <p class="cm-orientation-note" id="cm-orientation-note" role="status" hidden></p>
      <p class="cm-finding-text" id="cm-finding-text"><span class="cm-spin" aria-hidden="true"></span>正在找题目…</p>
      <button type="button" class="sq-primary cm-retry" id="cm-retry" hidden>重试加载照片</button>

      <div id="cm-choose" hidden>
        <div class="cm-chips" id="cm-chips" role="tablist" aria-label="题目"></div>
        <div class="cm-chosen">
          <img id="cm-chosen-img" alt="选中的题目">
        </div>
        <button type="button" class="sq-primary cm-go" id="cm-go">学这道题 <span aria-hidden="true">→</span></button>
        <p class="cm-sub"><button type="button" class="cm-link" id="cm-manual">没框对？手动框选</button><span>只计这一道的次数</span></p>
      </div>

      <div id="cm-cropping" hidden>
        <p class="cm-crop-hint">拖动边角，<b>只框住一道题</b>；有图的题连图一起框</p>
        <div class="sq-preview-actions">
          <button type="button" class="sq-ghost" id="cm-crop-cancel">取消</button>
          <button type="button" class="sq-primary" id="cm-crop-go">学这道题 <span aria-hidden="true">→</span></button>
        </div>
      </div>

      <p class="cm-proto-note" id="cm-proto-note" hidden>原型：真实照片的题目框为模拟</p>
    </div>
  </section>

  <div class="sq-toast" id="sq-toast" role="status" hidden></div>
</body>
</html>
